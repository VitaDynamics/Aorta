language = "C"
include_guard = "AORTA_C_API_H_"
cpp_compat = true
autogen_warning = "/* Warning: This file is autogenerated by cbindgen. Do not edit manually. */"

header = """
#include <stddef.h>
#include <stdint.h>
"""

[export]
include = ["AORTA_.*", "aorta_.*"]
# cbindgen does not evaluate `#[cfg(feature = ...)]`, so the test-only
# executor stop-window seam symbol (`test-seams` cargo feature)
# would leak into the public header — exclude it by name. Seam tests
# declare the extern locally against the feature-enabled Core target.
exclude = ["aorta_test_stop_window_seam"]

# cbindgen 0.29 does NOT enforce
# `#[repr(C)]` on input structs and silently emits whatever Rust says
# (it parses the type and trusts the attribute set, but performs no
# verification). The real ABI safety net is the size/align/offset
# `static_assert` pair across Rust + C++:
#
#   - Rust side: `core/src/ffi/abi_assert.rs`
#   - C++ side:  `cpp/test/abi_layout_test.cc`
#
# Treat this file as "header generator config" only — do not rely on
# any `[layout]` knob here for ABI guarantees.

[parse]
parse_deps = false
include = ["aorta_core"]
