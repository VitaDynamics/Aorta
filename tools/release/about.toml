# Cover every release target in every job so the notice set is identical:
# the two Linux SDK-bundle / wheel architectures and the macOS wheel targets
# (macOS wheels are development builds; Linux is the supported platform).
# The workspace graph is a conservative superset of libaorta_core.so's crates,
# including build dependencies and feature unification used by crate_universe;
# gen_third_party_notices.py --target narrows it to one triple's linked set.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-dev-dependencies = true
accepted = [
    "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "BSL-1.0", "CDLA-Permissive-2.0", "Unicode-3.0", "Unlicense",
    "Apache-2.0 WITH LLVM-exception", "EPL-2.0", "MPL-2.0",
]
workarounds = ["ring"]

# First-party crates are covered by the bundle LICENSE and NOTICE.
[private]
ignore = true

# zstd-sys declares `MIT/Apache-2.0` for the bindings but compiles the bundled
# Zstandard C library (zstd/lib, BSD-3-Clause, Meta Platforms) into every
# binary that links it — libaorta_core among them (trace CHUNK compression).
# The declared expression alone would drop the BSD notice; clarify it to the
# conjunction and pin the exact files so a crate bump re-verifies the texts
# (2026-09-15 dependency audit, item M3, zstd part).
[zstd-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[[zstd-sys.clarify.files]]
path = "LICENSE.Apache-2.0"
license = "Apache-2.0"
checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594"

[[zstd-sys.clarify.files]]
path = "LICENSE.Mit"
license = "MIT"
checksum = "129e8edef29e9abcd2ebabe252f4ef1b1289cdca356bf0040284a2fbccfb96c8"

# The generated bindings' own BSD-3 notice (Facebook) ...
[[zstd-sys.clarify.files]]
path = "LICENSE.BSD-3-Clause"
license = "BSD-3-Clause"
checksum = "48341f685c87304089aa099b23c386f8bacc519ef555aa7a13e239908907b3fd"

# ... and the Zstandard library's (Meta Platforms), the one that covers the
# C sources compiled into libaorta_core.
[[zstd-sys.clarify.files]]
path = "zstd/LICENSE"
license = "BSD-3-Clause"
checksum = "7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8"
