[package]
name = "aorta-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "aorta"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7"
zenoh = { workspace = true, features = ["shared-memory", "unstable"] }
aorta_core = { path = "../../core" }
aorta-introspect = { path = "../aorta-introspect" }
aorta-play = { path = "../aorta-play" }
aorta-record = { path = "../aorta-record" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
json5 = "0.4"
