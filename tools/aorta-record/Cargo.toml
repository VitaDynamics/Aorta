[package]
name = "aorta-record"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Aorta MCAP recorder library and CLI."
repository = "https://github.com/VitaDynamics/Aorta"
readme = "README.md"
rust-version.workspace = true
homepage.workspace = true

[lib]
name = "aorta_record"
path = "src/lib.rs"

[[bin]]
name = "aorta-record"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
zenoh = { workspace = true, features = ["shared-memory", "unstable"] }
aorta_core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
mcap = { version = "0.24.0", default-features = false, features = ["zstd", "lz4"] }
