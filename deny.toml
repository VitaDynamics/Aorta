# cargo-deny configuration for the Aorta workspace.
#
# Goals:
#   1. Catch dependency duplication (Tokio drift between Cargo.lock and
#      MODULE.bazel.lock should at least surface here).
#   2. Lock the set of allowed git sources (Zenoh supply chain — git-rev
#      pinned deps must be explicitly listed).
#   3. License compliance (avoid surprise GPL / unknown-license deps).
#
# Since the repo is a single Cargo workspace, CI runs
# `cargo deny --manifest-path Cargo.toml check` exactly once at the
# workspace root (see `.github/workflows/aorta-lint.yml`). The previous
# per-crate loop has been retired because every member now resolves
# through the same `Cargo.lock`.

[graph]
all-features = true
no-default-features = false

[advisories]
# Don't fail on warnings — only on advisories that match our `deny` list.
yanked = "warn"
ignore = [
    # No accepted CVEs at present. Add entries here as:
    #   { id = "RUSTSEC-XXXX-YYYY", reason = "..." }
]

[bans]
# Multiple-versions: Tokio once drifted between Cargo and Bazel (1.49 vs
# 1.52.1). The single Cargo workspace collapses the Cargo side to one
# Cargo.lock, but transitive deps still occasionally pull in two
# versions of crates like `hashbrown` and `getrandom`. We stay at "warn"
# until duplicate versions are tightened; the `skip` list below is the
# explicit allowlist for transitives we've already triaged.
multiple-versions = "warn"
wildcards = "deny"
# Path and `workspace = true` deps inside this repo are intentional
# (workspace-internal wiring); without this, every `aorta_core = { path
# = "../../core" }` line trips `wildcards`. cargo-deny still flags
# wildcard versions to external crates (`foo = "*"`), which is what we
# actually care about.
allow-wildcard-paths = true
highlight = "all"

# Crates we deliberately allow multiple versions of. Add justifications.
skip = [
    # tokio + Zenoh transitive deps frequently lag behind workspace pins.
]

# Crates that are explicitly forbidden (e.g., unmaintained alternatives).
deny = []

[licenses]
# v2 schema (cargo-deny >= 0.14). Multi-license SPDX expressions
# ("MIT OR Apache-2.0") resolve to "allowed" as soon as ANY allowed
# license satisfies them, which is what the allowlist below expects.
# v2 also removed `allow-osi-fsf-free` / `unlicensed` / `copyleft` —
# all three are now expressed by what is (or isn't) in `allow`.
version = 2
# Crates without an SPDX expression require an explicit confidence
# threshold; below it the build fails. 0.8 is the cargo-deny default.
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",                 # clipboard-win, error-code (arboard transitive); Boost permissive, MIT-compatible
    "CDLA-Permissive-2.0",     # webpki-roots, webpki-root-certs; permissive data license
    "EPL-2.0",                 # Zenoh
    "ISC",
    "MIT",
    # MPL-2.0 (file-level weak copyleft, no OR branch) is still required:
    # `serialport` + `option-ext` link into libaorta_core/zenohd, `nucleo` +
    # `nucleo-matcher` into aorta-tui, and `cbindgen` is the header
    # generator behind //tools/aorta-cbindgen (build tool, never linked).
    "MPL-2.0",
    "Unicode-3.0",             # icu_*
    "Unlicense",
    "Zlib",
]
# NOTE: `CC0-1.0` and `MIT-0` were removed from the allowlist on
# 2026-08-09 — cargo-deny reported `license-not-encountered` for both
# (no crate in the resolved graph uses them; the CC0-1.0 comment
# claiming webpki-roots was stale — webpki-roots ships
# CDLA-Permissive-2.0). Re-add individually with a justification when a
# dependency actually needs them; the licenses gate will name the crate.
# private = workspace-member crates that don't publish anywhere (every
# first-party aorta_* / aorta-* crate has `publish = false`). cargo-deny
# skips them so we don't have to slap a license header on private code.
private = { ignore = true }

# Per-crate license exceptions. Use sparingly — each entry overrides
# the allow-list above for one specific dependency.
exceptions = [
    # `unescaper` declares `license = "GPL-3.0/MIT"` (legacy
    # slash-separated SPDX for the intended "GPL-3.0 OR MIT" offer). We
    # accept it under the MIT side (per the upstream crate's stated
    # intent). With cargo-deny 0.19.6 the global `MIT` allow already
    # satisfies the declaration, so this entry is redundant; it is kept
    # as an explicit record (see docs/sbom/rust-license-summary.md §2.1).
    { allow = ["MIT"], name = "unescaper" },
]

[sources]
# Keep the set of git sources tight. Anything not listed here fails CI.
unknown-registry = "deny"
unknown-git = "deny"

allow-git = [
    # Zenoh is currently pinned to a git rev, pending an eventual move to a
    # crates.io stable release. Temporarily pointing at the
    # BOURBONCASK fork's `aorta/1.10.1` branch (upstream 1.10.1 + fork bugfixes +
    # locator-freshness / uring fixes + routing tree replay fix) while we
    # validate them upstream.
    "https://github.com/BOURBONCASK/zenoh.git",
    "https://github.com/eclipse-zenoh/zenoh-c.git",
]
