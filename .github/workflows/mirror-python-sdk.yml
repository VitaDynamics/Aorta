name: Mirror Python SDK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out mirror
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Bazel
        uses: ./.github/actions/setup-aorta-bazel
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Run python-sdk
        run: python3 .github/scripts/mirror_ci.py python-sdk
