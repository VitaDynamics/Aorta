name: Public pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-options:
    if: github.repository == 'VitaDynamics/aorta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python3 -m pip install pytest==8.4.2 flatbuffers==25.12.19
      - name: Test Python option marshaling
        run: python3 -m pytest -o addopts= -q python/tests/test_options.py
