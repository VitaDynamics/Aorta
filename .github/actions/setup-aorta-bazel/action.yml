name: Set up public Aorta Bazel
description: Install public build tools without private credentials or caches.
runs:
  using: composite
  steps:
    - name: Free hosted Linux disk space
      if: runner.environment == 'github-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - name: Install Bazelisk
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake ninja-build pkg-config
    - name: Verify Bazel
      shell: bash
      run: bazel version
    - name: Set up Rust
      shell: bash
      run: |
        rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
        echo "RUSTUP_TOOLCHAIN=1.92.0" >> "$GITHUB_ENV"
