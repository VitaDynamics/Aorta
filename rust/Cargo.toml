[package]
name = "aorta_sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
autoexamples = false
publish = false
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
aorta_core = { path = "../core" }
bytes = "1.10.1"
flatbuffers = "25.12.19"
tokio = { workspace = true, features = ["signal", "macros", "rt-multi-thread"] }
tracing = "0.1.44"

[dev-dependencies]
libc = "0.2"

[features]
examples = []

[[example]]
name = "flow_demo"
path = "examples/flow_demo.rs"
required-features = ["examples"]

[[example]]
name = "flow_recv_demo"
path = "examples/flow_recv_demo.rs"
required-features = ["examples"]

